# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# Variables used in this pipeline are defined in `shared-pipeline-vars`, which is `source`'d before calling `buildkite-agent pipeline upload`

agents:
  queue: mac

env:
  IMAGE_ID: $IMAGE_ID

steps:
  - label: "🧪 Build and Test iOS"
    key: test_ios
    command: |
      # This env var is provided at pipeline-upload time via `shared-pipeline-vars`, but wouldn't be visible
      # at job runtime. Using `env:` to propagate it is not an option on `mac` queue due to
      # https://linear.app/a8c/issue/AINFRA-332.
      export TEST_RESULTS_DIR="$TEST_RESULTS_DIR"
      .buildkite/commands/build-and-test-ios.sh
    plugins: [$CI_TOOLKIT_PLUGIN]
    artifact_paths:
      - .build/logs/*.log
      - $TEST_RESULTS_DIR/*
    notify:
      - github_commit_status:
          context: Build and Test iOS

  - label: "🛠️ Build macOS"
    key: build_macos
    command: |
      install_gems
      bundle exec fastlane mac build
    plugins: [$CI_TOOLKIT_PLUGIN]
    artifact_paths:
      - .build/logs/*.log
    notify:
      - github_commit_status:
          context: Build macOS
